<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Gợi Ý Món Ăn Thông Minh</title>
    <style>
        :root {
            --primary-color: #27ae60;
            --secondary-color: #3498db;
            --bg-color: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 { color: #2c3e50; margin-bottom: 30px; }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
        }

        .btn-login {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-login:hover { background-color: #219150; }

        .btn-guest {
            background-color: transparent;
            color: #7f8c8d;
            border: 2px solid #bdc3c7;
        }

        .btn-guest:hover {
            background-color: #f8f9fa;
            color: #2c3e50;
            border-color: #2c3e50;
        }

        .toggle-link {
            margin-top: 20px;
            font-size: 14px;
            color: #7f8c8d;
        }

        .toggle-link a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: bold;
        }

        .toggle-link a:hover { text-decoration: underline; }

        #registerFields { display: none; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="formTitle">Đăng nhập</h2>
    
    <div id="authForm">
        <div class="input-group" id="registerFields">
            <label>Họ và tên</label>
            <input type="text" id="fullname" placeholder="Nhập tên của bạn">
        </div>

        <div class="input-group">
            <label>Tên đăng nhập</label>
            <input type="text" id="username" placeholder="Nhập tài khoản">
        </div>

        <div class="input-group">
            <label>Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu">
        </div>

        <button class="btn-login" onclick="handleSubmit()" id="submitBtn">Đăng nhập</button>
        
        <button class="btn-guest" onclick="continueAsGuest()">Vào không cần tài khoản</button>

        <div class="toggle-link" id="toggleText">
            Chưa có tài khoản? <a href="#" onclick="toggleMode(true)">Đăng ký ngay</a>
        </div>
    </div>
</div>

<script>
    let isRegister = false;
    const API_BASE = "https://ai-kitchen-vu44.onrender.com/api";

    // Chuyển đổi qua lại giữa Đăng ký và Đăng nhập
    function toggleMode(register) {
        isRegister = register;
        document.getElementById('formTitle').innerText = isRegister ? "Đăng ký tài khoản" : "Đăng nhập";
        document.getElementById('submitBtn').innerText = isRegister ? "Tạo tài khoản" : "Đăng nhập";
        document.getElementById('registerFields').style.display = isRegister ? "block" : "none";
        document.getElementById('toggleText').innerHTML = isRegister 
            ? 'Đã có tài khoản? <a href="#" onclick="toggleMode(false)">Đăng nhập ngay</a>'
            : 'Chưa có tài khoản? <a href="#" onclick="toggleMode(true)">Đăng ký ngay</a>';
    }

    // Xử lý gửi dữ liệu lên Backend
    async function handleSubmit() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const fullname = document.getElementById('fullname').value;

        if (!username || !password) return alert("Vui lòng nhập đầy đủ thông tin!");

        const endpoint = isRegister ? "/register" : "/login";
        const payload = { username, password, fullname };

        try {
            const res = await fetch(API_BASE + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                if (isRegister) {
                    alert("Đăng ký thành công! Đang chuyển sang đăng nhập...");
                    toggleMode(false);
                } else {
                    localStorage.setItem("user_id", data.user.id);
                    localStorage.setItem("user_name", data.user.fullname);
                    window.location.href = "index.html"; // Chuyển sang trang chính
                }
            } else {
                alert(data.detail || "Có lỗi xảy ra!");
            }
        } catch (e) {
            alert("Không thể kết nối đến máy chủ Backend!");
        }
    }

    // Vào không cần tài khoản
    function continueAsGuest() {
        localStorage.removeItem("user_id");
        localStorage.removeItem("user_name");
        window.location.href = "index.html"; 
    }
</script>

</body>
</html>
